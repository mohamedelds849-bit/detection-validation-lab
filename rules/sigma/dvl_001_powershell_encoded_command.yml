title: PowerShell Launched With an Encoded Command
id: 8112e92f-c82f-4a42-b9ee-11982cceae00
status: test
description: >
  Detects powershell.exe or pwsh.exe started with -EncodedCommand (or one of its
  accepted abbreviations such as -e, -ec, -en, -enc). Encoding hides the real command
  from a quick look at the command line. Expected to fire on Atomic Red Team test
  a50d5a97 (T1027) in the CI telemetry job.
references:
  - https://attack.mitre.org/techniques/T1027/010/
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe
author: Mohamed Elansari
date: 2026-10-11
tags:
  - attack.stealth
  - attack.execution
  - attack.t1027.010
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_flag:
    # -EncodedCommand or any accepted abbreviation (-e, -ec, -en, -enc, ...) FOLLOWED by
    # a base64 blob. v1 used plain "contains ' -en'" and fired on "-Encoding ascii"
    # (Office setup, real Windows 10 baseline) - see docs/TUNING.md.
    CommandLine|re: '(?i)\s[-/]e(c|n[a-z]*)?\s+["'']?[A-Za-z0-9+/=]{20,}'
  condition: all of selection_*
falsepositives:
  - Management agents (SCCM, some RMM tools) that launch encoded PowerShell
  - A quoted string inside a command line that looks like " -e <20+ base64 characters>"
level: medium
